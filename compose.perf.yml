# CI load-test overlay (phase-5 plan 6, step 5.5d; ci.yml perf-load), on top of compose.yml and compose.ci.yml:
#   docker compose -f compose.yml -f compose.ci.yml -f compose.perf.yml up -d --wait app
# The image's server is `php artisan serve`: one PHP process that answers one request at a time and, being the CLI, runs without
# OPcache, so every request compiles the framework again. 60 polling devices and a burst of orders would measure that, not the code.
# Here PHP's built-in server runs the same router file (Laravel's resources/server.php, from public/) with
#   - PHP_CLI_SERVER_WORKERS=8 forked workers (the runner has four cores; the database waits on disk meanwhile), and
#   - OPcache on, as on any production PHP (the live host's LiteSpeed PHP has it; timestamps are not checked: nothing changes the code
#     during a run).
# The job also runs `php artisan optimize` before k6, as scripts/deploy/release.sh does on the live host. These figures describe the
# code under load; the host's share is the poll budget (PollBudgetTest and docs/runbook/server.md).
services:
  app:
    command:
      - sh
      - -c
      - >-
        cd public && exec php -d opcache.enable_cli=1 -d opcache.validate_timestamps=0 -d opcache.memory_consumption=256
        -d opcache.max_accelerated_files=20000 -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    environment:
      PHP_CLI_SERVER_WORKERS: "8"
