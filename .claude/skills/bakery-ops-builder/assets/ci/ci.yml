  # The Phase 6 gate (phase-6 plan 7.1 and 10.3): the needs of the phase (gate-p5, the Catalog and Orders module jobs the photos change, e2e-p6,
  # the strict i18n check of the new strings), then the gate:p6 Pest group on the compose stack (step 6.5, tests/Gate/Phase6GateTest.php: the
  # renditions, the 1000 x 750 crop, too_small, the media route's headers, 304 and 404, every demo product with a photo after Phase6Seeder,
  # nothing under public/), in the API image, whose gd has WebP as the live host's has, then gate_check. Informational while the phase is
  # open, as every gate job is (gate_check --ci turns a FAIL into a WARN until STATUS claims the phase done); the Pest step fails either way.
