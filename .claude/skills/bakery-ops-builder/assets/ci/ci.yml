# bakery-ops CI. The job graph mirrors the module dependency graph in
# .claude/skills/bakery-ops-builder/assets/dependency-manifest.json (ci.module_jobs / e2e_jobs / gate_jobs):
# a module's tests only run after the modules it depends on are green, and gate-pN fans in everything
# phase N relies on. Jobs for phases above docs/phases/STATUS.json current_phase are skipped.
# Every job states its timeout-minutes (phase-5 plan 7.1, step 5.5d): 20 unless a measured run needs more, so a hung step cannot hold a
# runner for six hours; a job that calls a reusable workflow gets the workflow's own (module-tests.yml 20 or its input, e2e.yml 30).
# Every pull request runs everything, and its `changes` job uploads the artifact ci-full-run. A pull request is merged by moving main to
# its head, so a push to main reuses that run (the `changes` job, scripts/ci_affected.py): when the pushed commit has a successful full
# pull request run from this repository, no job is selected, every test job is skipped, the gates run gate_check only, the run passes
# and deploy.yml starts; nothing reaches the site that did not pass the full graph on that very commit. A push that changes only docs/
# runs invariants and the checks of the generated files it touches; any other push, a manual run, or any doubt runs everything.
# Each job's `if:` has two branches: the full run keeps `success()` (a failed or skipped need skips the job, as before), and a selective
# run starts a selected job when every need it has passed or was not selected. The gate jobs are the required checks: they always run,
# and fail when anything they wait for failed.
name: ci

on:
  pull_request:
    # labeled: adding the label full-ci restarts the run in full
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ where are we
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      phase: ${{ steps.s.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: |
          phase=$(jq -r .current_phase docs/phases/STATUS.json)
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "current phase: $phase"
      - name: Validate STATUS.json
        run: python3 scripts/phase_status.py validate

  # ------------------------------------------------------------------ what this change can affect
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # actions: read lets a push to main find the pull request run it reuses (runs and their artifacts)
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.c.outputs.full }}
      jobs: ${{ steps.c.outputs.jobs }}
      reuse: ${{ steps.c.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        # full history: the changed files are the diff between the pull request's base and its head
        with: { fetch-depth: 0 }
      - name: The selection's own tests
        run: python3 -m unittest discover -s scripts/tests -p "test_ci_affected.py" -v
      - id: c
        name: Which jobs this change can affect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci_affected.py --event "$EVENT" --base "$BASE" --head "$HEAD" --labels-json "$LABELS"
          --sha "$SHA" --before "$BEFORE"
      # the mark a push to main looks for before it reuses this run: this pull request run selected everything
      - name: Mark this run as a full run
        if: github.event_name == 'pull_request' && steps.c.outputs.full == 'true'
        run: echo "${{ github.event.pull_request.head.sha }}" > ci-full-run.txt
      - if: github.event_name == 'pull_request' && steps.c.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with: { name: ci-full-run, path: ci-full-run.txt, retention-days: 30 }

  # ------------------------------------------------------------------ api static
  api-lint:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'api-lint'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - name: Pint
        working-directory: apps/api
        run: vendor/bin/pint --test
      - name: PHPStan
        working-directory: apps/api
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  api-arch:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'api-arch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_DATABASE: bakery_test, MYSQL_USER: bakery, MYSQL_PASSWORD: secret, MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bakery_test
      DB_USERNAME: bakery
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - name: Migration lint
        run: python3 scripts/check_invariants.py --numeric --branch-id --bilingual --append-only
      - name: Migrate test database
        working-directory: apps/api
        run: php artisan migrate --force --no-interaction
      - name: Architecture and invariant tests
        run: bash scripts/ci/pest-groups.sh "arch,invariants"

  invariants:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'invariants'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_DATABASE: bakery_test, MYSQL_USER: bakery, MYSQL_PASSWORD: secret, MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - name: Route list
        working-directory: apps/api
        env: { DB_CONNECTION: mysql, DB_HOST: 127.0.0.1, DB_PORT: 3306, DB_DATABASE: bakery_test, DB_USERNAME: bakery, DB_PASSWORD: secret }
        run: mkdir -p tmp && php artisan route:list --json > tmp/routes.json
      - name: All repo invariants
        run: python3 scripts/check_invariants.py --all --routes apps/api/tmp/routes.json

  openapi-check:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'openapi-check'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - name: Export spec and compare with docs/openapi.json
        working-directory: apps/api
        run: |
          php artisan scramble:export --path=tmp/openapi.json
          python3 - <<'PY'
          import json, sys
          a = json.load(open('tmp/openapi.json')); b = json.load(open('../../docs/openapi.json'))
          for d in (a, b): d.get('info', {}).pop('version', None)
          if a != b:
              print('docs/openapi.json is stale: run scripts/artisan scramble:export --path=../../docs/openapi.json'); sys.exit(1)
          print('openapi in sync')
          PY

  erd-check:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'erd-check'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/erd_check.py

  # ------------------------------------------------------------------ module chain (dependency order)
  mod-identity:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mod-identity'))
    uses: ./.github/workflows/module-tests.yml
    with: { module: identity, groups: "module:identity", contracts: "contract:catalog->identity,contract:orders->identity,contract:production->identity,contract:notifications->identity,contract:shifts->identity" }

  mod-catalog:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mod-catalog'))
    uses: ./.github/workflows/module-tests.yml
    with: { module: catalog, groups: "module:catalog", contracts: "contract:inventory->catalog,contract:orders->catalog,contract:production->catalog" }

  mod-inventory:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mod-inventory'))
    # three shards (Pest --shard) run side by side: the inventory groups took 22 minutes in one job, the longest
    # single job of the run; the gates read mod-inventory's result, which passes only when every shard passed
    strategy:
      fail-fast: false
      matrix: { shard: ["1/3", "2/3", "3/3"] }
    uses: ./.github/workflows/module-tests.yml
    # 30 minutes, not the reusable job's 20: the inventory groups (module:inventory, property, concurrency and four consumers'
    # contracts) took 18 m 34 s on PR #79 (run 40586333985) and 19 m 18 s on main at 76c25a0 (run 40554229133), so the 20-minute
    # default was a minute from cancelling the gate chain (phase-4 plan, 4.6b)
    with: { module: inventory, groups: "module:inventory,property,concurrency", contracts: "contract:orders->inventory,contract:production->inventory,contract:shifts->inventory", timeout_minutes: 30, shard: "${{ matrix.shard }}" }

  mod-orders:
    needs: [status, changes]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 1 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mod-orders'))
    uses: ./.github/workflows/module-tests.yml
    with: { module: orders, groups: "module:orders", contracts: "contract:payments->orders,contract:shifts->orders" }

  mod-payments:
    needs: [status, changes]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 1 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mod-payments'))
    uses: ./.github/workflows/module-tests.yml
    with: { module: payments, groups: "module:payments", contracts: "contract:shifts->payments" }

  mod-production:
    needs: [status, changes]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 2 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mod-production'))
    uses: ./.github/workflows/module-tests.yml
    with: { module: production, groups: "module:production" }

  mod-notifications:
    needs: [status, changes]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 2 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mod-notifications'))
    uses: ./.github/workflows/module-tests.yml
    with: { module: notifications, groups: "module:notifications" }

  mod-shifts:
    needs: [status, changes]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 3 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mod-shifts'))
    uses: ./.github/workflows/module-tests.yml
    # `seeds`: the demo bakery (Phase0Seeder ..) must stay valid as later phases change. Since step 3.2c the seeders open the
    # stations' shifts through Shifts (Demo\DemoShifts), so they run here, after every module they write through is green.
    with: { module: shifts, groups: "module:shifts,seeds", timeout_minutes: 30 }

  # The enforcement rehearsal (phase-3-plan.md 10.1): the Phase 0-2 exit-gate tests again with
  # ledger.require_shift_for_station_locations ON. Their fixtures open the shifts they write at (Tests\Support\Shifts), so
  # the same tests pass with the flag off (the module jobs above) and on (here). Dropped in 3.7e, when the default flips.
  enforced-gates:
    needs: [status, changes]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 3 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'enforced-gates'))
    uses: ./.github/workflows/module-tests.yml
    with:
      module: enforced-gates
      groups: "gate:p0,gate:p1,gate:p2"
      env: |
        LEDGER_REQUIRE_SHIFT_FOR_STATION_LOCATIONS=true

  mod-analytics:
    needs: [status, changes]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 4 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mod-analytics'))
    uses: ./.github/workflows/module-tests.yml
    # `seeds:p4`: the Phase 4 demo history (Phase4SeederTest, step 4.6a) rebuilds every day it writes, so it runs after Analytics is green
    with: { module: analytics, groups: "module:analytics,seeds:p4", contracts: "contract:analytics->facts" }

  # ------------------------------------------------------------------ web
  web-lint:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'web-lint'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: pnpm exec tsc --noEmit
        working-directory: apps/web

  i18n-check:
    needs: [status, changes]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 5 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'i18n-check'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_invariants.py --i18n ${{ fromJSON(needs.status.outputs.phase) >= 5 && '--strict-i18n' || '' }}

  web-build:
    needs: [changes]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'web-build'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-
      - run: pnpm build
        working-directory: apps/web
        env: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          retention-days: 1

  # ------------------------------------------------------------------ the print bridge (step 5.3b, ADR 0019)
  # tools/print-bridge: Node 22, no dependencies, no Docker. node --test runs it against a fake API (the rules of the bridge routes) and a
  # fake TCP printer that reads the bytes through the JS port of tests/Support/EscPosEmulator.php; install-service.ps1 must parse.
  print-bridge:
    needs: [status, changes]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 5 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'print-bridge'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run: { working-directory: tools/print-bridge }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: One dependency at most, nothing native
        run: |
          n=$(jq '((.dependencies // {}) + (.optionalDependencies // {}) + (.devDependencies // {})) | length' package.json)
          echo "dependencies: $n"
          if [ "$n" -gt 1 ]; then echo "::error::the print bridge takes one dependency at most (phase-5 plan 5.3b)"; exit 1; fi
          if find . \( -name '*.node' -o -name binding.gyp \) -print | grep -q .; then echo "::error::no native modules in the print bridge"; exit 1; fi
      - name: node --test (fake API, fake printer, the emulator)
        run: |
          set -o pipefail
          node --version
          node --test --test-reporter=spec "tests/*.test.js" | tee /tmp/print-bridge.txt
          if grep -Eq '(skipped|todo|cancelled) [1-9]' /tmp/print-bridge.txt; then echo "::error::a print-bridge test was skipped, cancelled or left todo"; exit 1; fi
          { echo "### print-bridge"; grep -E '(tests|pass|fail|duration_ms) [0-9]' /tmp/print-bridge.txt | tail -4; } >> "$GITHUB_STEP_SUMMARY"
      - name: install-service.ps1 parses, in ASCII (Windows PowerShell 5.1 reads a file without a BOM as ANSI)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install-service.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          if ([IO.File]::ReadAllBytes("$PWD/install-service.ps1") | Where-Object { $_ -gt 127 }) { Write-Error 'install-service.ps1 holds non-ASCII bytes'; exit 1 }

  # ------------------------------------------------------------------ api image for e2e
  docker-build:
    needs: changes
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php.Dockerfile
          target: ci
          tags: bakery-ops-api:ci
          outputs: type=docker,dest=/tmp/api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with: { name: api-image, path: /tmp/api.tar, retention-days: 1 }

  # ------------------------------------------------------------------ e2e per phase
  e2e-p0:
    needs: [status, changes, web-build, docker-build]
    if: >-
      (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e-p0')
      && (needs.web-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'web-build'))
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    uses: ./.github/workflows/e2e.yml
    with: { phase: 0, projects: "p0-admin-smoke" }

  e2e-p1:
    needs: [status, changes, web-build, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 1 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e-p1')
      && (needs.web-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'web-build'))
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    uses: ./.github/workflows/e2e.yml
    # polling transport, as the live host runs it (ADR 0009): the worker but no `ws` (Reverb) service,
    # BROADCAST_CONNECTION=null, NEXT_PUBLIC_LIVE_TRANSPORT=poll
    with: { phase: 1, projects: "p1-order-flow p1-shortfall", profiles: "full" }

  # e2e-p2, e2e-p3 and e2e-p4 are settled (phase-2-plan.md section 2, phase-3-plan.md section 2, F7, phase-4-plan.md 10.9 item 3): polling, with the worker the queued chains need.
  e2e-p2:
    needs: [status, changes, web-build, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 2 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e-p2')
      && (needs.web-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'web-build'))
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    uses: ./.github/workflows/e2e.yml
    with: { phase: 2, projects: "p2-stockout-production p2-purchase-transfer", profiles: "full" }

  e2e-p3:
    needs: [status, changes, web-build, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 3 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e-p3')
      && (needs.web-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'web-build'))
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    uses: ./.github/workflows/e2e.yml
    with: { phase: 3, projects: "p3-handover p3-opening-prefill", profiles: "full" }

  e2e-p4:
    needs: [status, changes, web-build, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 4 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e-p4')
      && (needs.web-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'web-build'))
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    uses: ./.github/workflows/e2e.yml
    # the demo history: 60 days here, the CI-only fallback of phase-4 plan section 8 (4.6a measured 938 s for the 90 days, over the 10-minute
    # budget); the 90-day figure stays for perf-dashboards (4.6b)
    with: { phase: 4, projects: "p4-pay-photo-split p4-dashboards", profiles: "full", history_days: "60" }

  # k6 against the dashboards (phase-4 plan 10.2 R-G, ci-cd.md): on the CI compose stack only, never the live host, with the full 90-day
  # demo history (DEMO_HISTORY_DAYS unset: the seeder's 90; about 12 minutes of seeding, so the timeout has room). Two admins read every
  # dashboard of those 90 days compared with the 90 before (scripts/perf/dashboards.k6.js): every answer a 200, p95 under 1000 ms per
  # read and in all. It runs beside e2e-p4 (both after mod-analytics, as the CI design's graph has it); the browser's first-data budget
  # is dashboards.spec.ts in e2e-p4 (its 60 days hold the 30 days the overview reads by default in full).
  perf-dashboards:
    needs: [status, changes, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 4 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'perf-dashboards')
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # the demo bakery's admin (Phase0Seeder): APP_ENV=testing in compose.ci.yml, so the documented local/CI password (e2e.yml)
      DEMO_ADMIN_PHONE: "+251900000101"
      DEMO_ADMIN_PASSWORD: demo-bakery-local
      # grafana/k6 1.3.0, pinned by the digest of its image index
      K6_IMAGE: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api-image, path: /tmp }
      - run: docker load -i /tmp/api.tar
      - name: Start the stack (the API, the database, Redis)
        run: docker compose -f compose.yml -f compose.ci.yml up -d --wait --wait-timeout 180 app
      - name: Migrate and seed the 90-day demo history
        run: |
          set -o pipefail
          docker compose -f compose.yml -f compose.ci.yml exec -T -e SEED_PHASE=4 app php artisan migrate:fresh --force --seed --seeder=DemoSeeder 2>&1 | grep -v ' DEBUG: ' | tee /tmp/seed.txt | tail -30
          grep -E '^Phase 4: ' /tmp/seed.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sign in as the demo admin, pick the range and the product, warm every read once
        run: |
          token=$(curl -fsS -X POST http://localhost:8000/api/v1/login -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d "{\"phone\":\"$DEMO_ADMIN_PHONE\",\"password\":\"$DEMO_ADMIN_PASSWORD\"}" | jq -r .token)
          test -n "$token" && test "$token" != null || { echo "::error::the demo admin could not sign in"; exit 1; }
          to=$(TZ=Africa/Addis_Ababa date -d yesterday +%F)
          from=$(TZ=Africa/Addis_Ababa date -d '90 days ago' +%F)
          item=$(docker compose -f compose.yml -f compose.ci.yml exec -T db mariadb -ubakery -psecret bakery -N -e \
            "SELECT item_id FROM daily_item_metrics WHERE kind = 'product' AND day BETWEEN '$from' AND '$to' GROUP BY item_id ORDER BY SUM(revenue) DESC, item_id LIMIT 1" | tr -d '[:space:]')
          test -n "$item" || { echo "::error::no product sold in $from..$to: the seed did not play the history"; exit 1; }
          echo "::add-mask::$token"
          { echo "K6_TOKEN=$token"; echo "K6_FROM=$from"; echo "K6_TO=$to"; echo "K6_ITEM=$item"; } >> "$GITHUB_ENV"
          echo "range $from..$to, product $item"
          for path in freshness overview sales sales/hourly channels items "items/$item" stations staff shifts; do
            curl -fsS -o /dev/null -w "warm-up $path: %{http_code} in %{time_total} s\n" -H "Authorization: Bearer $token" -H 'Accept: application/json' \
              "http://localhost:8000/api/v1/analytics/$path?from=$from&to=$to&compare=previous"
          done
      - name: k6 (p95 under 1000 ms per read)
        run: |
          set -o pipefail # k6 exits 99 when a threshold fails; the tee must not hide it
          mkdir -p /tmp/k6 && chmod 777 /tmp/k6 # the k6 image runs as a user of its own; it writes its summary there
          docker run --rm --network host -v "$PWD/scripts/perf:/scripts:ro" -v /tmp/k6:/out \
            -e BASE_URL=http://localhost:8000 -e TOKEN="$K6_TOKEN" -e FROM="$K6_FROM" -e TO="$K6_TO" -e ITEM="$K6_ITEM" \
            "$K6_IMAGE" run --quiet /scripts/dashboards.k6.js | tee /tmp/k6/stdout.txt
          sed -n '/^perf-dashboards (k6)/,$p' /tmp/k6/stdout.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs --no-color --tail=120 app
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: perf-dashboards, path: /tmp/k6, retention-days: 7, if-no-files-found: ignore }
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yml -f compose.ci.yml down -v

  # k6 load test of the shop's busiest hour (phase-5 plan 6, step 5.5d; 7.1; 10.2 D15): on the CI compose stack only, never the live host.
  # The demo bakery with 7 days of history and the 60 load devices (Phase5Seeder, LOAD_DEVICES=60). scripts/perf/load.k6.js polls from
  # the 60 devices at the web's cadences (apps/api/tests/Fixtures/perf/poll-profile.json) while 300 orders go from pad to till in 10
  # minutes; thresholds: polls p95 < 300 ms, writes p95 < 800 ms, errors < 0.5 %, all 300 paid. Then, once the queue is empty, the
  # perf:load group (tests/Gate/LoadRunGateTest.php) checks the database: exactly 300 new orders, all closed; the ledger reconciled; no
  # failed_jobs. compose.perf.yml serves the API with 8 PHP workers and OPcache on, and the job caches the config, routes and events as
  # a release does (the image's default `artisan serve` is one process without OPcache; the live host runs PHP behind LiteSpeed, so the
  # figures describe the code under load, not the host: PollBudgetTest and docs/runbook/server.md "Poll budget" speak for the host).
  # The queue worker starts after the seed, so migrate:fresh never races it.
  perf-load:
    needs: [status, changes, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 5 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'perf-load')
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DC: docker compose -f compose.yml -f compose.ci.yml -f compose.perf.yml
      # the demo accounts' documented local/CI password (APP_ENV=testing in compose.ci.yml; DemoCredentials::LOCAL_PASSWORD)
      DEMO_PASSWORD: demo-bakery-local
      LOAD_DEVICES: "60"
      LOAD_HISTORY_DAYS: "7"
      LOAD_ORDERS: "300"
      # grafana/k6 1.3.0, pinned by the digest of its image index (the image perf-dashboards uses)
      K6_IMAGE: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api-image, path: /tmp }
      - run: docker load -i /tmp/api.tar
      - name: Start the stack (the API with several workers, the database, Redis)
        run: $DC up -d --wait --wait-timeout 180 app
      - name: Migrate and seed ${{ env.LOAD_HISTORY_DAYS }} days of demo history and the load devices
        run: |
          set -o pipefail
          $DC exec -T -e SEED_PHASE=5 -e DEMO_HISTORY_DAYS="$LOAD_HISTORY_DAYS" -e LOAD_DEVICES="$LOAD_DEVICES" app \
            php artisan migrate:fresh --force --seed --seeder=DemoSeeder 2>&1 | grep -v ' DEBUG: ' | tee /tmp/seed.txt | tail -30
          grep -E '^Phase 4: ' /tmp/seed.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Start the queue worker; cache the config, routes and events as a release does (scripts/deploy/release.sh)
        run: |
          $DC up -d --wait --wait-timeout 120 worker
          $DC exec -T app php artisan optimize
      - name: Read the ids the burst uses and the last order before it
        run: |
          set -o pipefail
          q() { $DC exec -T db mariadb -ubakery -psecret bakery -N -e "$1" | tr -d '[:space:]'; }
          branch=$(q "SELECT id FROM branches WHERE name = 'Demo Bakery' ORDER BY id LIMIT 1")
          test -n "$branch" || { echo "::error::no demo branch: the seed failed"; exit 1; }
          devices=$(q "SELECT COUNT(*) FROM devices WHERE branch_id = $branch AND fingerprint LIKE 'load-%' AND revoked_at IS NULL AND deleted_at IS NULL")
          test "$devices" = "$LOAD_DEVICES" || { echo "::error::$devices load devices enrolled, not $LOAD_DEVICES"; exit 1; }
          {
            echo "KITCHEN_STATION=$(q "SELECT id FROM stations WHERE branch_id = $branch AND code = 'kitchen' ORDER BY id LIMIT 1")"
            echo "BAR_STATION=$(q "SELECT id FROM stations WHERE branch_id = $branch AND code = 'bar' ORDER BY id LIMIT 1")"
            echo "TILL_STATION=$(q "SELECT id FROM stations WHERE branch_id = $branch AND code = 'till' ORDER BY id LIMIT 1")"
            echo "KITCHEN_LOCATION=$(q "SELECT id FROM locations WHERE branch_id = $branch AND type = 'kitchen' AND deleted_at IS NULL ORDER BY id LIMIT 1")"
            echo "BAR_LOCATION=$(q "SELECT id FROM locations WHERE branch_id = $branch AND type = 'bar' AND deleted_at IS NULL ORDER BY id LIMIT 1")"
            echo "KITCHEN_ITEM=$(q "SELECT id FROM items WHERE branch_id = $branch AND sku = 'P-BRD-TOAST'")"
            echo "BAR_ITEM=$(q "SELECT id FROM items WHERE branch_id = $branch AND sku = 'P-HOT-BUNA'")"
            echo "BUNA_ITEM=$(q "SELECT id FROM items WHERE branch_id = $branch AND sku = 'ING-BUNA'")"
            echo "LOAD_ORDERS_AFTER=$(q "SELECT COALESCE(MAX(id), 0) FROM orders")"
          } | tee -a "$GITHUB_ENV"
      - name: k6 (60 devices polling, 300 orders in 10 minutes)
        id: k6
        run: |
          set -o pipefail # k6 exits 99 when a threshold fails; the tee must not hide it
          mkdir -p /tmp/k6 && chmod 777 /tmp/k6 # the k6 image runs as a user of its own; it writes its summary there
          docker run --rm --network host -v "$PWD/scripts/perf:/scripts:ro" -v "$PWD/apps/api/tests/Fixtures/perf:/profile:ro" -v /tmp/k6:/out \
            -e BASE_URL=http://localhost:8000 -e PASSWORD="$DEMO_PASSWORD" -e PROFILE=/profile/poll-profile.json -e PHOTO=/scripts/fixtures/receipt.jpg \
            -e KITCHEN_STATION -e BAR_STATION -e TILL_STATION -e KITCHEN_LOCATION -e BAR_LOCATION -e KITCHEN_ITEM -e BAR_ITEM -e BUNA_ITEM \
            "$K6_IMAGE" run --quiet /scripts/load.k6.js | tee /tmp/k6/stdout.txt
      - name: Wait for the queue to drain (at most 3 minutes)
        if: always() && steps.k6.outcome != 'skipped'
        run: |
          for i in $(seq 1 36); do
            size=$($DC exec -T app php artisan tinker --execute 'echo "queued=".Illuminate\Support\Facades\Queue::size();' 2>/dev/null | grep -oE 'queued=[0-9]+' | cut -d= -f2)
            echo "queue: ${size:-?} jobs"
            [ "$size" = "0" ] && exit 0
            sleep 5
          done
          echo "::error::the queue did not drain in 3 minutes"; exit 1
      - name: After the run, pest --group=perf:load (exactly the orders sent, all closed; the ledger reconciled; no failed jobs)
        if: always() && steps.k6.outcome != 'skipped'
        run: |
          set -o pipefail
          # the tests read phpunit.xml's configuration, not the release cache k6 ran with
          $DC exec -T app php artisan optimize:clear
          # the image has no .env (the variables come from compose): an empty one keeps PHPUnit from warning on every test (as gate-p4)
          $DC exec -T app touch .env
          $DC exec -T -e IDENTITY_REQUIRE_DEVICE=false -e GATE_SEED_DATABASE=bakery -e LOAD_ORDERS_AFTER -e LOAD_ORDERS app \
            vendor/bin/pest --group=perf:load --colors=never 2>&1 | grep -v ' DEBUG: ' | tee /tmp/k6/after.txt
          if grep -Eq "No tests (found|executed)" /tmp/k6/after.txt; then echo "::error::the perf:load group ran nothing"; exit 1; fi
          if grep -Eiq "Tests:.*(skipped|todo|incomplete|risky|warning|deprecat|notice)" /tmp/k6/after.txt; then echo "::error::a perf:load check was skipped or warned"; exit 1; fi
      - name: Figures in the step summary
        if: always() && steps.k6.outcome != 'skipped'
        run: |
          { echo '```'; sed -n '/^perf-load (k6)/,$p' /tmp/k6/stdout.txt; grep -E '^\[perf-load\]' /tmp/k6/after.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: $DC logs --no-color --tail=150 app worker
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: perf-load, path: /tmp/k6, retention-days: 7, if-no-files-found: ignore }
      - name: Stop the stack
        if: always()
        run: $DC down -v

  # Phase 5 (step 5.1b; phase-5 plan 7.1, 10.2 D17, ADR 0009): polling with the worker, as on the live host, beside e2e-p4 instead of after
  # it; two days of demo history (its projects need none, the default would replay 90). The 30-minute limit is e2e.yml's job timeout (a
  # job that calls a reusable workflow cannot set its own). Device enforcement is on for every e2e job (compose.ci.yml).
  e2e-p5:
    needs: [status, changes, web-build, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 5 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e-p5')
      && (needs.web-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'web-build'))
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    uses: ./.github/workflows/e2e.yml
    with: { phase: 5, projects: "p5-device p5-offline p5-amharic", profiles: "full", history_days: "2" }

  # Phase 6 (step 6.0; phase-6 plan 7.1): the redesign and product photos, on the stack e2e-p5 runs (polling with the worker, two days of
  # history, device enforcement on), beside it after mod-analytics. SEED_PHASE=6 composes every phase seeder, Phase6Seeder last (step 6.1c):
  # every demo product gets its demo photo. p6-product-photo and p6-a11y start as fixme placeholders (e2e.yml refuses an empty project of
  # a phase in progress); 6.2b replaces the a11y one, 6.4b the product-photo one.
  e2e-p6:
    needs: [status, changes, web-build, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 6 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e-p6')
      && (needs.web-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'web-build'))
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    uses: ./.github/workflows/e2e.yml
    with: { phase: 6, projects: "p6-product-photo p6-a11y", profiles: "full", history_days: "2" }

  # The restore drill (phase-5 plan 5.5b and 7.1; ADR 0020; go-live checklist item backup-drill-ci), on the compose stack and the API image,
  # which carries the MariaDB 10.11 clients of the live host: first the backup tests (group ops: the real mysqldump and mysql against the
  # test server), then the demo bakery seeded with GATE_SEED_DAYS of history into `bakery`, `backup:run` into a folder outside the app,
  # `backup:drill --keep` into `bakery_drill` (docker/mysql/init.sql creates it; --keep leaves the restored copy for the next step), and one
  # Pest process with gate:p0 (Phase 0's ledger property and oracle tests, on the same server) and gate:p5:restored (RestoredLedgerGateTest
  # on the restored copy, against the source). A skipped or warning test fails the step, as in gate-p4. Nothing here touches the live host.
  backup-drill:
    needs: [status, changes, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 5 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'backup-drill')
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GATE_SEED_DAYS: "14"
      DC: docker compose -f compose.yml -f compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api-image, path: /tmp }
      - run: docker load -i /tmp/api.tar
      - name: Start the stack (the API, the database, Redis)
        run: $DC up -d --wait --wait-timeout 180 app
      - name: The MariaDB clients in the image
        run: $DC exec -T app sh -c 'mysqldump --version && mysql --version' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Backup and drill tests (group ops)
        run: |
          set -o pipefail
          # the image has no .env: an empty one keeps phpdotenv's suppressed read from turning into a warning on every test (gate-p4)
          $DC exec -T app touch .env
          $DC exec -T -e IDENTITY_REQUIRE_DEVICE=false app vendor/bin/pest --group=ops --colors=never 2>&1 | grep -v ' DEBUG: ' | tee /tmp/ops.txt
          if grep -Eq "No tests (found|executed)" /tmp/ops.txt; then echo "::error::the ops group ran nothing"; exit 1; fi
          if grep -Eiq "Tests:.*(skipped|todo|incomplete|risky|warning|deprecat|notice)" /tmp/ops.txt; then echo "::error::an ops test was skipped or warned"; exit 1; fi
      - name: Migrate and seed ${{ env.GATE_SEED_DAYS }} days of demo history
        run: |
          set -o pipefail
          $DC exec -T -e SEED_PHASE=4 -e DEMO_HISTORY_DAYS="$GATE_SEED_DAYS" app \
            php artisan migrate:fresh --force --seed --seeder=DemoSeeder 2>&1 | grep -v ' DEBUG: ' | tee /tmp/seed.txt | tail -30
          grep -E '^Phase 4: ' /tmp/seed.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: backup:run, then backup:drill into bakery_drill
        run: |
          set -o pipefail
          start=$(date +%s)
          $DC exec -T -e BACKUP_PATH=/tmp/bakery-ops-backups app php artisan backup:run 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          $DC exec -T -e BACKUP_PATH=/tmp/bakery-ops-backups -e BACKUP_DRILL_DATABASE=bakery_drill app \
            php artisan backup:drill --keep 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "backup and drill: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pest gate:p0 and gate:p5:restored on the restored server
        run: |
          set -o pipefail
          $DC exec -T -e IDENTITY_REQUIRE_DEVICE=false -e GATE_SEED_DATABASE=bakery_drill -e GATE_SEED_DAYS="$GATE_SEED_DAYS" -e GATE_SOURCE_DATABASE=bakery app \
            vendor/bin/pest --group=gate:p0 --group=gate:p5:restored --colors=never 2>&1 | grep -v ' DEBUG: ' | tee /tmp/restored.txt
          if grep -Eq "No tests (found|executed)" /tmp/restored.txt; then echo "::error::the restored gate ran nothing"; exit 1; fi
          if grep -Eiq "Tests:.*(skipped|todo|incomplete|risky|warning|deprecat|notice)" /tmp/restored.txt; then echo "::error::a restored gate test was skipped or warned: the gate fails, it never skips"; exit 1; fi
          grep -q 'gate:p5:restored' /tmp/restored.txt || { echo "::error::RestoredLedgerGateTest did not run"; exit 1; }
          grep -E '^\[gate:p5:restored' /tmp/restored.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Logs on failure
        if: failure()
        run: $DC logs --no-color --tail=120 app
      - name: Stop the stack
        if: always()
        run: $DC down -v

  # ------------------------------------------------------------------ gates (required checks on main)
  gate-p0:
    needs: [changes, api-arch, api-lint, docker-build, e2e-p0, erd-check, invariants, mod-catalog, mod-identity, mod-inventory, openapi-check, web-build, web-lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # full history: once a phase is claimed done, gate_check verifies done_commit is an ancestor of HEAD and that
        # no app code changed after it, which a shallow clone cannot answer
        with: { fetch-depth: 0 }
      # a gate is a required check, so it runs even when a job it waits for failed, and fails here instead of being skipped
      # (a skipped required check counts as passed); on a pull request a job the change did not need may be skipped
      - name: Every job this gate waits for passed, or this change did not need it
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
          JOBS: ${{ needs.changes.outputs.jobs }}
        run: python3 scripts/ci_affected.py --check-needs
      - run: python3 scripts/gate_check.py --mode done --phase 0 --ci

  gate-p1:
    needs: [status, changes, api-arch, api-lint, docker-build, e2e-p0, e2e-p1, erd-check, invariants, mod-catalog, mod-identity, mod-inventory, mod-orders, mod-payments, openapi-check, web-build, web-lint]
    if: ${{ !cancelled() && fromJSON(needs.status.outputs.phase) >= 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # full history: once a phase is claimed done, gate_check verifies done_commit is an ancestor of HEAD and that
        # no app code changed after it, which a shallow clone cannot answer
        with: { fetch-depth: 0 }
      # a gate is a required check, so it runs even when a job it waits for failed, and fails here instead of being skipped
      # (a skipped required check counts as passed); on a pull request a job the change did not need may be skipped
      - name: Every job this gate waits for passed, or this change did not need it
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
          JOBS: ${{ needs.changes.outputs.jobs }}
        run: python3 scripts/ci_affected.py --check-needs
      - run: python3 scripts/gate_check.py --mode done --phase 1 --ci

  gate-p2:
    needs: [status, changes, api-arch, api-lint, docker-build, e2e-p0, e2e-p1, e2e-p2, erd-check, invariants, mod-catalog, mod-identity, mod-inventory, mod-notifications, mod-orders, mod-payments, mod-production, openapi-check, web-build, web-lint]
    if: ${{ !cancelled() && fromJSON(needs.status.outputs.phase) >= 2 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # full history: once a phase is claimed done, gate_check verifies done_commit is an ancestor of HEAD and that
        # no app code changed after it, which a shallow clone cannot answer
        with: { fetch-depth: 0 }
      # a gate is a required check, so it runs even when a job it waits for failed, and fails here instead of being skipped
      # (a skipped required check counts as passed); on a pull request a job the change did not need may be skipped
      - name: Every job this gate waits for passed, or this change did not need it
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
          JOBS: ${{ needs.changes.outputs.jobs }}
        run: python3 scripts/ci_affected.py --check-needs
      - run: python3 scripts/gate_check.py --mode done --phase 2 --ci

  gate-p3:
    needs: [status, changes, api-arch, api-lint, docker-build, e2e-p0, e2e-p1, e2e-p2, e2e-p3, enforced-gates, erd-check, invariants, mod-catalog, mod-identity, mod-inventory, mod-notifications, mod-orders, mod-payments, mod-production, mod-shifts, openapi-check, web-build, web-lint]
    if: ${{ !cancelled() && fromJSON(needs.status.outputs.phase) >= 3 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # full history: once a phase is claimed done, gate_check verifies done_commit is an ancestor of HEAD and that
        # no app code changed after it, which a shallow clone cannot answer
        with: { fetch-depth: 0 }
      # a gate is a required check, so it runs even when a job it waits for failed, and fails here instead of being skipped
      # (a skipped required check counts as passed); on a pull request a job the change did not need may be skipped
      - name: Every job this gate waits for passed, or this change did not need it
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
          JOBS: ${{ needs.changes.outputs.jobs }}
        run: python3 scripts/ci_affected.py --check-needs
      - run: python3 scripts/gate_check.py --mode done --phase 3 --ci

  # The Phase 4 gate (phase-4 plan 10.3): the needs of the CI design (gate-p3, mod-analytics, e2e-p4, perf-dashboards), then the
  # gate:p4 group on the seeded history. The demo bakery is seeded once on the compose stack with 90 days of history
  # (GATE_SEED_DAYS, the gate's own figure), and the gate:p4 group runs in the app container in one Pest process: the seeded tests
  # (Tests\Support\SeededGate) point their connection at the seeded database (GATE_SEED_DATABASE) without RefreshDatabase or
  # DatabaseTruncation, and fail, never skip, when fewer days are built; the race tests of the group (DatabaseTruncation) keep
  # phpunit.xml's bakery_test, so nothing beside the seeded tests can wipe the seed. A skipped or warning test fails the step. Then gate_check.
  # The gate:p4 Pest group, moved out of gate-p4 (2026-11-12) so it runs beside the other test jobs instead of after
  # them; gate-p4 needs this job and fails when it failed.
  pest-gate-p4:
    needs: [status, changes, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 4 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'pest-gate-p4')
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GATE_SEED_DAYS: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api-image, path: /tmp }
      - run: docker load -i /tmp/api.tar
      - name: Start the stack (the API, the database, Redis)
        run: docker compose -f compose.yml -f compose.ci.yml up -d --wait --wait-timeout 180 app
      - name: Migrate and seed ${{ env.GATE_SEED_DAYS }} days of demo history
        run: |
          set -o pipefail
          docker compose -f compose.yml -f compose.ci.yml exec -T -e SEED_PHASE=4 -e DEMO_HISTORY_DAYS="$GATE_SEED_DAYS" app \
            php artisan migrate:fresh --force --seed --seeder=DemoSeeder 2>&1 | grep -v ' DEBUG: ' | tee /tmp/seed.txt | tail -30
          grep -E '^Phase 4: ' /tmp/seed.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pest group gate:p4 on the seeded history
        run: |
          set -o pipefail
          # the image has no .env (the variables come from compose): phpdotenv's suppressed read of a missing file is reported by PHPUnit
          # as a warning on every test, so an empty one is put there and a warning then fails the gate like a skip
          docker compose -f compose.yml -f compose.ci.yml exec -T app touch .env
          # the stack enforces enrolled devices (compose.ci.yml); the tests keep the code default (off) and turn it on where they test it
          docker compose -f compose.yml -f compose.ci.yml exec -T -e IDENTITY_REQUIRE_DEVICE=false -e GATE_SEED_DATABASE=bakery -e GATE_SEED_DAYS="$GATE_SEED_DAYS" app \
            vendor/bin/pest --group=gate:p4 --colors=never 2>&1 | grep -v ' DEBUG: ' | tee /tmp/gate-p4.txt
          if grep -Eq "No tests (found|executed)" /tmp/gate-p4.txt; then echo "::error::the gate:p4 group ran nothing"; exit 1; fi
          if grep -Eiq "Tests:.*(skipped|todo|incomplete|risky|warning|deprecat|notice)" /tmp/gate-p4.txt; then echo "::error::a gate:p4 test was skipped or warned: the gate fails, it never skips"; exit 1; fi
          grep -E '^\[(gate:p4|dashboard budget)' /tmp/gate-p4.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs --no-color --tail=120 app
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yml -f compose.ci.yml down -v

  gate-p4:
    needs: [status, changes, api-arch, api-lint, docker-build, e2e-p0, e2e-p1, e2e-p2, e2e-p3, e2e-p4, enforced-gates, erd-check, invariants, mod-analytics, mod-catalog, mod-identity, mod-inventory, mod-notifications, mod-orders, mod-payments, mod-production, mod-shifts, openapi-check, perf-dashboards, web-build, web-lint, pest-gate-p4]
    if: ${{ !cancelled() && fromJSON(needs.status.outputs.phase) >= 4 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # full history: once a phase is claimed done, gate_check verifies done_commit is an ancestor of HEAD and that
        # no app code changed after it, which a shallow clone cannot answer
        with: { fetch-depth: 0 }
      # a gate is a required check, so it runs even when a job it waits for failed, and fails here instead of being skipped
      # (a skipped required check counts as passed); on a pull request a job the change did not need may be skipped
      - name: Every job this gate waits for passed, or this change did not need it
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
          JOBS: ${{ needs.changes.outputs.jobs }}
        run: python3 scripts/ci_affected.py --check-needs
