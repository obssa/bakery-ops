        run: python3 scripts/gate_check.py --mode done --phase 4 --ci

  # The Phase 5 gate (phase-5 plan 7.1 and 10.3, step 5.6b): the needs of the CI design (gate-p4, e2e-p5, i18n-check, the backup drill,
  # the load run, the print bridge), then the gate:p5 group on the compose stack and gate_check with the go-live checklist. The group needs no seed: its
  # tests make their own rows in phpunit.xml's bakery_test. The image holds apps/api only, so the checklist test reads the repository's
  # docs/ and scripts/ from a copy in the container named by GATE_REPO_ROOT. A skipped or warning test fails the step, as in gate-p4;
  # its passing is the checklist's `self` (device-enforcement, print-emulator).
  # The gate:p5 Pest group, moved out of gate-p5 (2026-11-12) so it runs beside the other test jobs instead of after
  # them; gate-p5 needs this job and fails when it failed.
  pest-gate-p5:
    needs: [status, changes, docker-build]
    if: >-
      fromJSON(needs.status.outputs.phase) >= 5 && (needs.changes.outputs.full == 'true' && success() ||
      needs.changes.outputs.full == 'false' && !cancelled() && needs.changes.result == 'success'
      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'pest-gate-p5')
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api-image, path: /tmp }
      - run: docker load -i /tmp/api.tar
      - name: Start the stack (the API, the database, Redis)
        run: docker compose -f compose.yml -f compose.ci.yml up -d --wait --wait-timeout 180 app
      - name: Pest group gate:p5
        run: |
          set -o pipefail
          dc="docker compose -f compose.yml -f compose.ci.yml"
          # the image has no .env (the variables come from compose): an empty one keeps phpdotenv's read from warning on every test
          $dc exec -T app touch .env
          # the checklist test reads docs/go-live-checklist.json, its schema and scripts/ from the repository, which the image lacks
          $dc exec -T app mkdir -p /tmp/repo
          $dc cp docs app:/tmp/repo/docs
          $dc cp scripts app:/tmp/repo/scripts
          # the stack enforces enrolled devices (compose.ci.yml); the tests keep the code default (off) and turn it on where they test it
          $dc exec -T -e IDENTITY_REQUIRE_DEVICE=false -e GATE_REPO_ROOT=/tmp/repo app \
            vendor/bin/pest --group=gate:p5 --colors=never 2>&1 | grep -v ' DEBUG: ' | tee /tmp/gate-p5.txt
          if grep -Eq "No tests (found|executed)" /tmp/gate-p5.txt; then echo "::error::the gate:p5 group ran nothing"; exit 1; fi
          if grep -Eiq "Tests:.*(skipped|todo|incomplete|risky|warning|deprecat|notice)" /tmp/gate-p5.txt; then echo "::error::a gate:p5 test was skipped or warned: the gate fails, it never skips"; exit 1; fi
          grep -E "^ +Tests:" /tmp/gate-p5.txt | sed 's/^ */gate:p5 /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs --no-color --tail=120 app
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yml -f compose.ci.yml down -v

  gate-p5:
    needs: [status, changes, api-arch, api-lint, backup-drill, docker-build, e2e-p0, e2e-p1, e2e-p2, e2e-p3, e2e-p4, e2e-p5, enforced-gates, erd-check, i18n-check, invariants, mod-analytics, mod-catalog, mod-identity, mod-inventory, mod-notifications, mod-orders, mod-payments, mod-production, mod-shifts, openapi-check, perf-dashboards, perf-load, print-bridge, web-build, web-lint, pest-gate-p5, pest-gate-p4]
