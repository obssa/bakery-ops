      && contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'pest-gate-p6')
      && (needs.docker-build.result == 'success' || !contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'docker-build')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api-image, path: /tmp }
