# Reusable e2e job: bring up the real stack (compose.yml + compose.ci.yml) from the image the
# docker-build job produced, seed the demo bakery up to the phase, serve the built Next app, and run
# the phase's Playwright projects natively on the runner.
name: e2e

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: number
      projects:
        description: space separated Playwright project names
        required: true
        type: string
      profiles:
        description: compose profiles to enable (e.g. "full" for worker, ws and the Caddy proxy; "s3" adds minio)
        required: false
        type: string
        default: ""

jobs:
  playwright:
    name: e2e phase ${{ inputs.phase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: api-image, path: /tmp }
      - run: docker load -i /tmp/api.tar

      - name: Start stack
        env:
          COMPOSE_PROFILES: ${{ inputs.profiles }}
        run: docker compose -f compose.yml -f compose.ci.yml up -d --wait --wait-timeout 180

      - name: Migrate and seed up to phase ${{ inputs.phase }}
        run: docker compose -f compose.yml -f compose.ci.yml exec -T -e SEED_PHASE=${{ inputs.phase }} app php artisan migrate:fresh --force --seed --seeder=DemoSeeder

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - uses: actions/download-artifact@v4
        with: { name: web-build, path: apps/web/.next }

      - name: Playwright browsers (cached)
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        working-directory: apps/web
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # A project p<N>-<flow> belongs to phase N. While phase N has not started (STATUS.json todo, planning or
      # plan_approved) its specs may not exist yet, so an empty project passes (--pass-with-no-tests). Once the phase is
      # in_progress, gate_pending or done, every one of its projects must list at least one test: a phase that has
      # started cannot hide missing e2e tests, and an empty project never rides along on another project's tests.
      - name: Projects of started phases have tests
        id: pw
        working-directory: apps/web
        run: |
          started=0
          for p in ${{ inputs.projects }}; do
            n=$(echo "$p" | sed -nE 's/^p([0-9]+)-.*/\1/p')
            if [ -z "$n" ]; then echo "::error::Playwright project '$p' is not named p<phase>-<flow>"; exit 1; fi
            s=$(jq -r --arg n "$n" '.phases[$n].status // "todo"' ../../docs/phases/STATUS.json)
            case "$s" in
              todo|planning|plan_approved) echo "$p: phase $n is $s, no specs required yet" ;;
              *)
                started=1
                if ! pnpm exec playwright test --list --project="$p" > /tmp/pw-list.txt 2>&1; then
                  tail -5 /tmp/pw-list.txt
                  echo "::error::phase $n is $s but Playwright project $p has no tests"; exit 1
                fi
                echo "$p: phase $n is $s, $(grep -E '^Total:' /tmp/pw-list.txt)" ;;
            esac
          done
          if [ "$started" = 0 ]; then echo "allow=--pass-with-no-tests" >> "$GITHUB_OUTPUT"; else echo "allow=" >> "$GITHUB_OUTPUT"; fi

      - name: Run Playwright projects
        working-directory: apps/web
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_REVERB_HOST: localhost
          NEXT_PUBLIC_REVERB_PORT: "8080"
          NEXT_PUBLIC_REVERB_SCHEME: http
          PLAYWRIGHT_WEB_SERVER: next-start
        run: |
          args=""
          for p in ${{ inputs.projects }}; do args="$args --project=$p"; done
          pnpm exec playwright test $args ${{ steps.pw.outputs.allow }}

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs --no-color --tail=200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-p${{ inputs.phase }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
