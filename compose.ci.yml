# CI e2e overlay: use the image built by the docker-build job (loaded from its artifact),
# expose the API (and Reverb, when the `ws` profile is on) to the runner so Playwright (running natively) can reach
# them, and run the app in testing mode with a single Octane worker once Octane is introduced.
#   docker compose -f compose.yml -f compose.ci.yml up -d --wait
# Live updates poll as on the live host (ADR 0009): BROADCAST_CONNECTION=null unless the e2e job starts the `ws`
# profile, in which case .github/workflows/e2e.yml sets BROADCAST_CONNECTION=reverb.
services:
  app:
    image: bakery-ops-api:ci
    build: !reset null
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seSE=
      OCTANE_WORKERS: "1"
      # The three Phase 3 shift rules are ON by default in the code (step 3.7e), so the e2e stack runs them without an override.
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-null}
      REVERB_APP_ID: ci
      REVERB_APP_KEY: ci-key
      REVERB_APP_SECRET: ci-secret
    ports:
      - "8000:8000"

  worker:
    image: bakery-ops-api:ci
    environment:
      APP_ENV: testing
      APP_KEY: base64:Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seSE=

  ws:
    image: bakery-ops-api:ci
    environment:
      APP_ENV: testing
      APP_KEY: base64:Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seSE=
      REVERB_APP_ID: ci
      REVERB_APP_KEY: ci-key
      REVERB_APP_SECRET: ci-secret
    ports:
      - "8080:8080"

  minio:
    ports:
      - "9000:9000"

  # Init container for the `files-s3` job: creates the bucket once MinIO is healthy, then exits. Run it with
  #   COMPOSE_PROFILES=s3 docker compose -f compose.yml -f compose.ci.yml run --rm mc
  # (same pinned image as minio, which ships the mc client; the credentials are the throwaway CI values of compose.yml)
  mc:
    image: bitnamilegacy/minio:2025.7.23
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set ci http://minio:9000 bakery bakerysecret &&
        mc mb --ignore-existing ci/bakery &&
        mc ls ci
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    profiles: ["s3"]
