# The uptime check (phase-5 plan 10.2 D14 and section 7.1, step 5.5c; docs/go-live-checklist.json `uptime-monitor`).
# Every 15 minutes GitHub's scheduler sends one GET /api/v1/health to the live site: the same public read the deploy's smoke test
# makes (scripts/deploy/smoke.sh). When it is not ok, it is read once more 60 s later; the job fails only when both reads are not ok,
# and a failed scheduled run emails the repository owner (GitHub's own notification), which is the alert. Nothing else: no write, no
# login, no secret, no checkout. The URL is the repository variable DEPLOY_URL that deploy.yml uses; it is never written in this file,
# and the job is skipped while the variable is unset. A paid or external monitor can replace this later (D14).
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  health:
    name: GET /health on the live site
    if: vars.DEPLOY_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read /api/v1/health, and once more after 60 s when it is not ok
        env:
          BASE_URL: ${{ vars.DEPLOY_URL }}
        run: |
          # ok: HTTP 200 with {"status":"ok","database":"ok"}; a query string per read so no cache in front answers for the server
          check() {
            local body
            body="$(curl -sS --fail --max-time 20 -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              "${BASE_URL%/}/api/v1/health?uptime=$(date +%s%N)")" || { echo "the read failed or did not answer 200"; return 1; }
            echo "$body" | jq -e '.status == "ok" and .database == "ok"' > /dev/null || { echo "health answered: $body"; return 1; }
          }
          if check; then echo "health ok"; exit 0; fi
          echo "::warning::the health check was not ok; reading it again in 60 s"
          sleep 60
          if check; then echo "health ok on the second read"; exit 0; fi
          echo "::error::GET /api/v1/health was not ok twice in a row, 60 s apart"
          exit 1
