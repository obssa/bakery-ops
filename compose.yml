# Base stack. Production-shaped: the API image carries its own code (target ci).
# Local development layers compose.dev.yml on top (bind mounts, dev target, exposed ports):
#   docker compose -f compose.yml -f compose.dev.yml up -d --wait
# CI e2e layers compose.ci.yml (pre-built image from the docker-build job).
name: bakery-ops

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: http://localhost:8000
  APP_TIMEZONE: UTC
  # the web shell runs on `next start` at :3000 locally and in CI (production serves it from the API's own origin)
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mariadb
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: bakery
  DB_USERNAME: bakery
  DB_PASSWORD: secret
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # live updates poll (ADR 0009): null sends and queues nothing; set reverb (with the `ws` profile) to switch WebSockets on
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-null}
  REVERB_HOST: ws
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  AWS_ENDPOINT: http://minio:9000
  # two hosts (traps.md): the app container signs and fetches against AWS_ENDPOINT (minio:9000, a name only the compose network knows);
  # a browser outside the stack would reach the same server at AWS_URL, and a signature is bound to the host it was made for
  AWS_URL: http://localhost:9000
  AWS_BUCKET: bakery
  AWS_ACCESS_KEY_ID: bakery
  AWS_SECRET_ACCESS_KEY: bakerysecret
  AWS_DEFAULT_REGION: us-east-1
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

services:
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: ci
    image: bakery-ops-api:local
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  worker:
    image: bakery-ops-api:local
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    environment:
      <<: *api-env
    depends_on:
      app:
        condition: service_healthy
    profiles: ["full"]

  # Reverb: only when a WebSocket transport is switched on (ADR 0009), so its own profile, not `full`: the live host and
  # the e2e jobs poll (BROADCAST_CONNECTION=null). Start it with COMPOSE_PROFILES=full,ws and BROADCAST_CONNECTION=reverb.
  ws:
    image: bakery-ops-api:local
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *api-env
    depends_on:
      app:
        condition: service_healthy
    profiles: ["ws"]

  db:
    # MariaDB 10.11: the engine the live site runs on (shared cPanel, ADR 0006); CI uses the same image.
    # PostgreSQL stays an option for a VPS; keep schema and tests portable (DECIMAL, JSON, triggers, FOR UPDATE).
    image: mariadb:10.11
    # log_bin_trust_function_creators: the append-only triggers (audit_log, stock_movements, order_events) are
    # created by migrations as the app user; with binary logging on, the server otherwise demands SUPER (1419).
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--log-bin-trust-function-creators=1"]
    environment:
      MARIADB_DATABASE: bakery
      MARIADB_USER: bakery
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible store for the portability job `files-s3` ONLY (phase-4 plan 4.2b, 10.1 R-F): the live host keeps receipt photos on its local
  # private disk (ADR 0006, 0015). Its own profile, not `full`. The upstream minio/minio images are no longer published (Docker Hub and quay.io
  # refuse the pull, checked 2026-10-20 and again 2026-10-25), so this is the last archived Bitnami build of the same MinIO server, pinned by
  # tag. The credentials below are throwaway values for a local container that never leaves the CI runner or the developer PC; they protect
  # nothing, and no real key is ever written in this repository.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: bakery
      MINIO_ROOT_PASSWORD: bakerysecret
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["s3"]

  web:
    image: caddy:2-alpine
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    profiles: ["full"]

volumes:
  db_data:
  minio_data:
